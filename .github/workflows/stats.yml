name: Update profile stats

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.STATS_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate stats card
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python scripts/generate_stats.py

      - name: Commit updated card
        run: |
          git config user.name "Irfan Jat"
          git config user.email "irfanalijat17@gmail.com"
          git add assets/github-stats.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update contribution stats card"
            git push
          fi
